<!-- main page where we can feature a car of the week !--> 
 <!DOCTYPE html>
 <html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>John's Car Collection</title>
        <link rel="icon" href="./images/logo.svg" type="image/svg+xml">
        <link rel="stylesheet" href="styles.css">
        <script src="theme.js" defer></script>
    </head>
    <body> 
        <header class="shared">
            <div class="logo" role="img" aria-label="John's Car Collection monogram">
                <span class="logo-j">J</span>
                <span class="logo-c">c</span>
            </div>
            <nav aria-label="Main navigation">
                <ul>
                    <li><a href="index.html" data-label="Home" aria-current="page"><span>Home</span></a></li>
                    <li><a href="about.html" data-label="About"><span>About</span></a></li>
                </ul>
            </nav>
            <div class="header-controls">
                <button class="theme-toggle" type="button" aria-label="Switch to night mode" aria-pressed="false" title="Switch to night mode">
                    <span class="theme-icon" aria-hidden="true">☾</span>
                </button>
                <button class="font-toggle" type="button" aria-label="Turn readable font on" aria-pressed="false" title="Turn readable font on">
                    <span aria-hidden="true">T</span>
                </button>
            </div>
        </header>
        <main>
            <h1>Car of the Week</h1>
            <img src="./images/car_of_the_week.jpg" alt="Car of the Week" width="600" height="400">
            <p>This week's featured car is a stunning <strong>insent car model here</strong>!</p>
        </main>
    </body>
</html>
